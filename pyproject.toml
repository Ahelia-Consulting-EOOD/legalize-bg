[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legalize-bg"
version = "0.1.0"
description = "Bulgarian legislation as code — MCP server over a SQLite index of the corpus"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "lxml>=5.0",
    "fastmcp>=2.0,<4.0",
]

# Console entry point: `legalize-bg-mcp [--db PATH] [--corpus PATH] [--strict]`
# starts the FastMCP stdio server. Equivalent to `python -m mcp_server`.
[project.scripts]
legalize-bg-mcp = "mcp_server.__main__:main"
legalize-bg-api = "api.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.setuptools.packages.find]
include = ["fetcher*", "index*", "mcp_server*", "api*"]
exclude = ["tests*", "scripts*", "research*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "perf: latency budgets against the live catalog (excluded in CI; run locally on a quiet machine)",
]
