[project]
name = "legalize-bg"
version = "0.1.0"
description = "Bulgarian legislation as code"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "lxml>=5.0",
    "fastmcp>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
include = ["fetcher*", "index*", "mcp_server*"]
exclude = ["tests*", "scripts*", "research*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
