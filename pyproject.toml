[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legalize-bg"
version = "0.1.0"
description = "Bulgarian legislation as code — MCP server over a SQLite index of the corpus"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "lxml>=5.0",
    "fastmcp>=2.0,<4.0",
]

# Console entry point: `legalize-bg-mcp [--db PATH] [--corpus PATH] [--strict]
# [--transport {stdio,http,sse,streamable-http}] [--host H] [--port P]]` starts
# the FastMCP server — stdio by default (FR-031), network transports over HTTP.
# Equivalent to `python -m mcp_server`.
[project.scripts]
legalize-bg-mcp = "mcp_server.__main__:main"
legalize-bg-api = "api.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.setuptools.packages.find]
include = ["fetcher*", "index*", "mcp_server*", "api*"]
exclude = ["tests*", "scripts*", "research*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "perf: latency budgets against the live catalog (excluded in CI; run locally on a quiet machine)",
    "slow: whole-corpus measurements (tens of seconds; they run in CI, since they are the evidence the resolver's bounds are justified by)",
]

[tool.uv]
# certifi 2026.10.19 removes the compromised eMudhra intermediates (October 2026). uv.lock is not tracked
# here, so the floor below is what moves a local lock off the old bundle on its next `uv sync`. The
# exclude-newer-package entry is a release-delay exception for certifi alone (ahelia-oversight
# policies/supply-chain-security.md; the route that ~/.claude/hooks/supply-chain-exceptions.tsv names):
# 2026.10.19 is younger than the 7-day delay. Remove that entry after 27 October 2026; keep the floor.
constraint-dependencies = ["certifi>=2026.10.19"]
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z" }
