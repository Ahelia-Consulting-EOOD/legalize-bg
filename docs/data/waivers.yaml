# docs/data/waivers.yaml
# Enumerated exceptions to the correctness floor. Equality is enforced:
# an act that stops violating must be removed here, or the run fails.
#
# Act lists are produced by running the detectors and pasting their
# enumeration, never hand-typed. The three entries below carry rulings that
# are already adjudicated in the record, but their detectors are NOT part of
# Part II (the machine floor ships tag_remnants and chrome only), so their
# act lists stay empty until the detector that fills each one exists. An
# empty list is not an assertion that the class is clean; it is the absence
# of a census, and Owner Directive 10 forbids repairing before that census
# exists.
