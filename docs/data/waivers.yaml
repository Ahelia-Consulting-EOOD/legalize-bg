# docs/data/waivers.yaml
# Enumerated exceptions to the correctness floor. Equality is enforced on the
# COUNT: an act that stops violating must be removed here, an act whose count
# falls must have its count updated here, and a new violation in a waived act
# is reported as an excess. Any of the three fails the run.
#
# Every entry is dated, signed and names its expiry condition; a waiver that
# carries less is refused at load (Owner Directive 12).
#
# Act lists are produced by running the detectors and pasting their
# enumeration, never hand-typed:
#
#   python -m corpus_integrity --root . --check CHECK --enumerate
#
# A waived act is not re-enumerated while it is waived. To re-census a class
# during a repair sweep, run the detector against a copy of this file with
# that entry's acts emptied.
#
# The first three entries carry rulings that are already adjudicated in the
# record, but their detectors are NOT part of Part II (the machine floor ships
# tag_remnants and chrome only), so their act lists stay empty until the
# detector that fills each one exists. An empty list is not an assertion that
# the class is clean; it is the absence of a census, and Owner Directive 10
# forbids repairing before that census exists.
frontmatter_dates:
  ruling: "FR-011 triage — faithful to lex.bg, which carries no date signal for these acts"
  owner_signed: 2026-08-11
  expires: "the frontmatter-date detector ships and its corpus-wide census replaces this empty list"
  acts: []  # fill from: python -m corpus_integrity --check frontmatter_dates --enumerate
empty_body:
  ruling: "lex.bg content-less stub pages; surfaced to callers as <doc_id=N>"
  owner_signed: 2026-08-11
  expires: "the empty-body detector ships and its corpus-wide census replaces this empty list"
  acts: []  # detector not yet implemented
no_article_anchor:
  ruling: "single-§ instruments (денонсиране, оттегляне на резерва, опрощаване) and ethics codes"
  owner_signed: 2026-08-11
  expires: "the article-anchor detector ships and its corpus-wide census replaces this empty list"
  acts: []  # detector not yet implemented
