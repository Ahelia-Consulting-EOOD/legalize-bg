what: The acts of the corpus promulgated before the Gazette's online archive (1989), with the investigator's verdict on whether each is still in force, from the pairing of its title with the Gazette's unattributed repeal titles and the general repeal decrees, and from lex.bg's history line (S3, D-077). No Gazette text of these acts exists online.
limits:
- 'The Gazette''s PDF era (1989 to бр. 120/2002) was not searched: its issues expose no materials list, so a repeal published then is not seen.'
- 'A repeal carried inside another act''s transitional and final provisions is not seen: only materials whose title repeals an act, and the bodies of the general repeal decrees, were paired.'
- lex.bg's history line is a witness, never an authority (D-061); the corpus's estado field is the bootstrap's constant and was not used.
- A verdict in_force rests on a fact that shows the act alive in the HTML era and on no candidate naming it; unknown says that nothing found is not evidence of force.
